project:
  type: website
  output-dir: .

website:
  google-analytics:
    tracking-id: "G-BEELJ2ZRED"
  title: "Stat Mania"
  site-url: "https://www.statmania.info/courses/rprogramming/"
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: dark
    logo: ../../img/statmania_logo.svg
    logo-href: ../../index.html
    left:
      - href: index.qmd
        text: "R Programming"
      - href: ../index.html
        text: All Courses
        icon: mortarboard
  sidebar:
    style: docked
    background: dark
    title: "R Programming"
    contents:
      - text: "Course Overview"
        href: index.qmd
      - section: "Lessons"
        contents:
          - text: "1. Variables & Basic Types"
            href: variables.qmd
          - text: "2. Vectors"
            href: vectors.qmd
          - text: "3. Functions"
            href: functions.qmd
          - text: "4. Control Flow"
            href: control-flow.qmd
          - text: "5. Data Frames"
            href: data-frames.qmd
          - text: "6. Plotting"
            href: plotting.qmd
          - text: "7. Your Turn"
            href: your-turn.qmd

format:
  html:
    theme:
      - cosmo
      - dark.scss
    css: styles.css
    toc: false
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    include-after-body:
      - ../../starfield-include.html
      - text: |
          <script src="qwebr-force-dark.js"></script>
          <script src="quiz.js"></script>
