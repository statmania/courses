<script>
/* Course template behaviour: progress tracking (localStorage), the right-column
   cards on lesson pages, and the home-page tabs/accordion. No dependencies. */
(function () {
  var offset = (document.querySelector('meta[name="quarto:offset"]') || {}).content || './';
  var rootPath = new URL(offset, location.href).pathname;
  var KEY = 'course-progress:' + rootPath;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  function idOf(pathname) {
    return pathname.replace(rootPath, '').replace(/\.html$/, '');
  }
  var here = idOf(location.pathname);
  var done = load();

  /* ---- Sidebar checkmarks (every page) ---- */
  function paintSidebar() {
    document.querySelectorAll('#quarto-sidebar a.sidebar-link').forEach(function (a) {
      var id = idOf(new URL(a.getAttribute('href'), location.href).pathname);
      a.classList.toggle('sm-done', done.indexOf(id) > -1);
    });
  }

  /* ---- Lesson page: reading bar + right-column cards ---- */
  var isLesson = !!document.querySelector('.lesson-meta');
  if (isLesson) {
    var bar = document.createElement('div');
    bar.className = 'sm-readbar';
    document.body.appendChild(bar);
    var onScroll = function () {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      bar.style.width = (max > 0 ? Math.min(100, h.scrollTop / max * 100) : 0) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    var margin = document.getElementById('quarto-margin-sidebar');
    if (margin) {
      var add = function (el) { margin.appendChild(el); return el; };
      var tk = document.querySelector('.takeaways');
      if (tk) { tk.classList.add('in-margin'); margin.insertBefore(tk, margin.firstChild); }

      /* reading progress, under the outline */
      var rp = add(document.createElement('div'));
      rp.className = 'rail-card rail-progress';
      rp.innerHTML = '<div class="rp-row"><span>Reading progress</span><b>0%</b></div><div class="rp-track"><div class="rp-fill"></div></div>';
      var paintRp = function () {
        var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
        var pct = max > 0 ? Math.round(Math.min(100, h.scrollTop / max * 100)) : 100;
        rp.querySelector('b').textContent = pct + '%';
        rp.querySelector('.rp-fill').style.width = pct + '%';
      };
      window.addEventListener('scroll', paintRp, { passive: true });
      paintRp();

      ['.cheatsheet', '.resources'].forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) add(el);
      });
      /* margin notes / glossary: collect into the rail, so they are reachable without scrolling */
      document.querySelectorAll('#quarto-document-content .column-margin').forEach(add);

      /* private notes, saved per lesson in this browser */
      var NKEY = 'course-notes:' + rootPath + here;
      var notes = add(document.createElement('div'));
      notes.className = 'rail-card notes';
      notes.innerHTML = '<h4><i class="fa-solid fa-pen-to-square"></i>My notes</h4><textarea rows="4" placeholder="Jot something down\u2026" aria-label="My notes for this lesson"></textarea><div class="notes-hint">Saved in this browser only.</div>';
      var ta = notes.querySelector('textarea');
      try { ta.value = localStorage.getItem(NKEY) || ''; } catch (e) {}
      ta.addEventListener('input', function () {
        try { if (ta.value) localStorage.setItem(NKEY, ta.value); else localStorage.removeItem(NKEY); } catch (e) {}
      });

      /* "Mark as complete" sits at the bottom of the lesson, just above the previous/next links */
      var card = document.createElement('div');
      card.className = 'complete-card';
      var pn = document.querySelector('#quarto-document-content nav.page-navigation, nav.page-navigation');
      if (pn) pn.insertAdjacentElement('beforebegin', card);
      else document.getElementById('quarto-document-content').appendChild(card);
      card.innerHTML = '<button type="button" class="btn-complete"></button>';
      var btn = card.querySelector('button');
      var paint = function () {
        var d = done.indexOf(here) > -1;
        btn.classList.toggle('is-done', d);
        btn.innerHTML = d ? '<i class="fa-solid fa-circle-check"></i> Completed' : '<i class="fa-regular fa-circle"></i> Mark as complete';
      };
      btn.addEventListener('click', function () {
        var i = done.indexOf(here);
        if (i > -1) done.splice(i, 1); else done.push(here);
        save(done); paint(); paintSidebar();
      });
      paint();
    }
  }
  paintSidebar();


  /* ---- Small screens: "On this page" dropdown (sticky under the navbar) ----
     Quarto's own TOC toggle is hidden in CSS; this one shows the current section. */
  window.addEventListener('load', function () {
    var toc = document.querySelector('#quarto-margin-sidebar #TOC');
    var main = document.getElementById('quarto-document-content');
    if (!toc || !main) return;
    var hashOf = function (a) {
      var h = a.getAttribute('data-scroll-target') || a.getAttribute('href') || '';
      var i = h.indexOf('#');
      return i < 0 ? '' : h.slice(i);
    };
    var srcs = [].filter.call(toc.querySelectorAll('a'), function (a) { return hashOf(a).length > 1; });
    if (!srcs.length) return;
    var box = document.createElement('details');
    box.className = 'sm-toc-mobile';
    var sum = document.createElement('summary');
    var nav = document.createElement('nav');
    nav.setAttribute('aria-label', 'On this page');
    var links = srcs.map(function (src) {
      var a = document.createElement('a');
      a.href = hashOf(src);
      a.textContent = src.textContent;
      a.addEventListener('click', function () { box.open = false; });
      nav.appendChild(a);
      return a;
    });
    box.appendChild(sum);
    box.appendChild(nav);
    main.insertBefore(box, main.firstChild);
    var heads = links.map(function (a) { return document.getElementById(decodeURIComponent(a.hash.slice(1))); });
    var spy = function () {
      var cur = 0;
      heads.forEach(function (h, i) { if (h && h.getBoundingClientRect().top < 120) cur = i; });
      links.forEach(function (a, i) { a.classList.toggle('active', i === cur); });
      sum.textContent = 'On this page \u00b7 ' + (links[cur] ? links[cur].textContent : '');
    };
    window.addEventListener('scroll', spy, { passive: true });
    spy();
  });

  /* ---- Home page ---- */
  var ch = document.querySelector('.ch');
  if (ch) {
    var total = +ch.dataset.total;
    var rows = ch.querySelectorAll('.lesson-row');
    var refresh = function () {
      var n = 0;
      rows.forEach(function (r) {
        var d = done.indexOf(r.dataset.lesson) > -1;
        r.classList.toggle('is-done', d);
        if (d) n++;
      });
      var pct = total ? Math.round(n / total * 100) : 0;
      document.querySelector('.ring-pct').textContent = pct + '%';
      document.querySelector('.ring-done').textContent = n;
      var fg = document.querySelector('.ring-fg');
      var c = 2 * Math.PI * 26;
      fg.style.strokeDasharray = c;
      fg.style.strokeDashoffset = c * (1 - pct / 100);
      ch.querySelectorAll('.module').forEach(function (m) {
        var mr = m.querySelectorAll('.lesson-row'), md = m.querySelectorAll('.lesson-row.is-done').length;
        var cnt = m.querySelector('.mod-count');
        cnt.textContent = md ? md + ' / ' + mr.length + ' done' : mr.length + ' lessons';
      });
      var next = Array.prototype.find.call(rows, function (r) { return !r.classList.contains('is-done'); });
      var go = document.querySelector('.btn-go');
      go.querySelector('.btn-go-label').textContent = n === 0 ? 'Start course' : (n === total ? 'Review course' : 'Continue');
      go.setAttribute('href', next ? next.getAttribute('href') : ch.dataset.first);
      document.querySelector('.btn-reset').hidden = n === 0;
    };
    document.querySelector('.btn-reset').addEventListener('click', function () {
      done = []; save(done); refresh(); paintSidebar();
    });
    refresh();

    var tabs = ch.querySelectorAll('.ch-tabs button');
    var show = function (name) {
      tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
      ch.querySelectorAll('.ch-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'tab-' + name); });
    };
    tabs.forEach(function (t) {
      t.addEventListener('click', function () { show(t.dataset.tab); history.replaceState(null, '', '#' + t.dataset.tab); });
    });
    if (location.hash) show(location.hash.slice(1));

    /* small screens: the Start/progress card moves from the right rail to just under the hero */
    var railCard = document.querySelector('.ch-card'), hero = ch.querySelector('.ch-hero');
    if (railCard && hero) {
      var rail = railCard.parentNode, mq = window.matchMedia('(max-width: 991.98px)');
      var place = function () {
        if (mq.matches) { hero.parentNode.insertBefore(railCard, hero.nextSibling); railCard.classList.add('ch-card-inline'); }
        else { rail.appendChild(railCard); railCard.classList.remove('ch-card-inline'); }
      };
      place();
      (mq.addEventListener ? mq.addEventListener('change', place) : mq.addListener(place));
    }

    var toggle = document.getElementById('toggle-all');
    toggle.addEventListener('click', function () {
      var mods = ch.querySelectorAll('.module');
      var open = toggle.textContent === 'Expand all';
      mods.forEach(function (m) { m.open = open; });
      toggle.textContent = open ? 'Collapse all' : 'Expand all';
    });
  }
})();
</script>
<script>
/* All Courses page: card progress (read from each course's own saved progress),
   "Continue learning", search, filters and sorting. */
(function () {
  var cat = document.querySelector('.cat');
  if (!cat) return;
  var cards = [].slice.call(cat.querySelectorAll('.cc'));

  /* progress: every course on this domain stores 'course-progress:<its root path>' */
  var cont = [];
  cards.forEach(function (c) {
    if (!c.dataset.root || c.dataset.root === '#') return;
    var key = 'course-progress:' + new URL(c.dataset.root, location.href).pathname;
    var n = 0;
    try { n = (JSON.parse(localStorage.getItem(key)) || []).length; } catch (e) {}
    var total = +c.dataset.total;
    if (!n || !total) return;
    var pct = Math.min(100, Math.round(n / total * 100));
    var p = c.querySelector('.cc-prog');
    p.hidden = false;
    p.querySelector('i').style.width = pct + '%';
    p.querySelector('span').textContent = n + ' of ' + total + ' lessons';
    c.querySelector('.cc-btn-label').textContent = pct >= 100 ? 'Review course' : 'Continue';
    if (pct < 100) cont.push({ title: c.querySelector('h3').textContent, href: c.dataset.root, pct: pct });
  });
  var box = document.getElementById('cat-continue');
  if (cont.length) {
    var ul = box.querySelector('ul');
    cont.forEach(function (x) {
      var li = document.createElement('li');
      li.innerHTML = '<a></a><span></span>';
      li.querySelector('a').textContent = x.title;
      li.querySelector('a').href = x.href;
      li.querySelector('span').textContent = x.pct + '%';
      ul.appendChild(li);
    });
    box.hidden = false;
  }

  /* filters + search + sort */
  var q = document.getElementById('cat-q'), sort = document.getElementById('cat-sort');
  var count = document.getElementById('cat-count'), empty = document.getElementById('cat-empty');
  var grid = cat.querySelector('.cat-grid');
  var boxes = [].slice.call(cat.querySelectorAll('input[data-facet]'));
  var apply = function () {
    var chosen = {};
    boxes.forEach(function (b) { if (b.checked) (chosen[b.dataset.facet] = chosen[b.dataset.facet] || []).push(b.value); });
    var term = q.value.trim().toLowerCase(), shown = 0;
    cards.forEach(function (c) {
      var ok = Object.keys(chosen).every(function (k) { return chosen[k].indexOf(c.dataset[k]) > -1; });
      if (ok && term) ok = c.dataset.text.indexOf(term) > -1;
      c.hidden = !ok;
      if (ok) shown++;
    });
    count.textContent = shown + (shown === 1 ? ' course' : ' courses');
    empty.hidden = shown > 0;
  };
  var order = function () {
    var by = sort.value;
    cards.slice().sort(function (a, b) {
      if (by === 'az') return a.dataset.title.localeCompare(b.dataset.title);
      if (by === 'newest') return (b.dataset.updated || '').localeCompare(a.dataset.updated || '') || a.dataset.order - b.dataset.order;
      return (b.dataset.featured - a.dataset.featured) || (a.dataset.order - b.dataset.order);
    }).forEach(function (c) { grid.appendChild(c); });
  };
  boxes.forEach(function (b) { b.addEventListener('change', apply); });
  q.addEventListener('input', apply);
  sort.addEventListener('change', order);
  document.getElementById('cat-clear').addEventListener('click', function () {
    boxes.forEach(function (b) { b.checked = false; });
    q.value = ''; apply();
  });
  order(); apply();
})();
</script>
<script>
/* Quiz component: single-choice (data-quiz="mcq") and fill-in-the-blank
   (data-quiz="fitb"). Graded client-side. Same markup contract as the
   rprogramming course, so lessons can be ported unchanged. */
(function () {
  function norm(s) { return (s || '').trim(); }
  function feedback(quiz, ok, msg) {
    var fb = quiz.querySelector('.sm-quiz-feedback');
    if (!fb) return;
    if (msg) { fb.textContent = msg; fb.className = 'sm-quiz-feedback sm-quiz-feedback-bad'; return; }
    fb.innerHTML = ok ? '<i class="fa-solid fa-circle-check"></i> Correct!' : '<i class="fa-solid fa-circle-xmark"></i> Not quite — try again.';
    fb.className = 'sm-quiz-feedback ' + (ok ? 'sm-quiz-feedback-ok' : 'sm-quiz-feedback-bad');
    if (ok) quiz.classList.add('sm-quiz-correct');
  }
  function gradeMcq(quiz) {
    var checked = quiz.querySelector('input[type="radio"]:checked');
    quiz.querySelectorAll('.sm-quiz-options label').forEach(function (l) { l.classList.remove('sm-quiz-picked'); });
    if (!checked) return feedback(quiz, false, 'Pick an option first.');
    checked.closest('label').classList.add('sm-quiz-picked');
    feedback(quiz, norm(checked.value).toLowerCase() === norm(quiz.dataset.answer).toLowerCase());
  }
  function gradeFitb(quiz) {
    var input = quiz.querySelector('.sm-quiz-blank');
    if (!input) return;
    var ok = norm(input.value) === norm(quiz.dataset.answer);
    input.classList.toggle('sm-quiz-blank-ok', ok);
    input.classList.toggle('sm-quiz-blank-bad', !ok);
    feedback(quiz, ok);
  }
  document.querySelectorAll('.sm-quiz[data-quiz]').forEach(function (quiz) {
    var grade = quiz.dataset.quiz === 'mcq' ? gradeMcq : gradeFitb;
    var btn = quiz.querySelector('.sm-quiz-check');
    if (btn) btn.addEventListener('click', function () { grade(quiz); });
    var blank = quiz.querySelector('.sm-quiz-blank');
    if (blank) blank.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); grade(quiz); } });
  });
})();
</script>
