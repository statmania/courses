<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">float vs double bit layout</title>
  <desc id="d">A float uses 32 bits: 1 sign bit, 8 exponent bits and 23 mantissa bits. A double uses 64 bits: 1 sign bit, 11 exponent bits and 52 mantissa bits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="338" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e6edf7">
    <text x="450" y="34" fill="#6b7a99" font-size="12" letter-spacing="2">BIT LAYOUT · IEEE 754 · WIDTH IS TO SCALE</text>

    <!-- float: 32 bits, 800px => 25 px/bit -->
    <text x="60" y="88" font-size="18" font-weight="700" fill="#00e5ff" text-anchor="start">float</text>
    <text x="840" y="88" font-size="13" fill="#9fb3d1" text-anchor="end">4 bytes · 32 bits · ~7 digits</text>
    <rect x="50" y="100" width="25" height="56" rx="4" fill="#ff2fb4" fill-opacity=".25" stroke="#ff2fb4" stroke-width="2"/>
    <rect x="75" y="100" width="200" height="56" rx="4" fill="#a855f7" fill-opacity=".25" stroke="#a855f7" stroke-width="2"/>
    <rect x="275" y="100" width="575" height="56" rx="4" fill="#00e5ff" fill-opacity=".2" stroke="#00e5ff" stroke-width="2"/>
    <text x="62" y="134" font-size="14">1</text>
    <text x="175" y="134" font-size="15">exponent · 8</text>
    <text x="562" y="134" font-size="15">mantissa · 23</text>

    <!-- double: 64 bits, 800px => 12.5 px/bit -->
    <text x="60" y="208" font-size="18" font-weight="700" fill="#00e5ff" text-anchor="start">double</text>
    <text x="840" y="208" font-size="13" fill="#9fb3d1" text-anchor="end">8 bytes · 64 bits · ~15 digits</text>
    <rect x="50" y="220" width="12.5" height="56" rx="3" fill="#ff2fb4" fill-opacity=".25" stroke="#ff2fb4" stroke-width="2"/>
    <rect x="62.5" y="220" width="137.5" height="56" rx="3" fill="#a855f7" fill-opacity=".25" stroke="#a855f7" stroke-width="2"/>
    <rect x="200" y="220" width="650" height="56" rx="3" fill="#00e5ff" fill-opacity=".2" stroke="#00e5ff" stroke-width="2"/>
    <text x="131" y="254" font-size="15">exponent · 11</text>
    <text x="525" y="254" font-size="15">mantissa · 52</text>

    <!-- legend -->
    <g font-size="12" fill="#9fb3d1" text-anchor="start">
      <rect x="260" y="304" width="12" height="12" rx="2" fill="#ff2fb4"/><text x="280" y="315">sign</text>
      <rect x="350" y="304" width="12" height="12" rx="2" fill="#a855f7"/><text x="370" y="315">exponent = range</text>
      <rect x="520" y="304" width="12" height="12" rx="2" fill="#00e5ff"/><text x="540" y="315">mantissa = precision</text>
    </g>
  </g>
</svg>
