<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">srand(time(NULL)) seeds the random sequence</title>
  <desc id="d">A clock face feeds its time into a seed box labelled srand, which starts a row of random numbers produced by rand().</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a1a"/>
      <stop offset="1" stop-color="#0e2a2a"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1f4a4a"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e8fffb">
    <circle cx="150" cy="180" r="85" fill="#071a1a" stroke="#fbbf24" stroke-width="6"/>
    <path d="M150 180 V120 M150 180 L192 205" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="150" cy="180" r="7" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round"><path d="M150 106 V114 M150 246 V254 M76 180 H84 M216 180 H224"/></g>
    <text x="150" y="305" font-size="17" text-anchor="middle" fill="#fbbf24">time(NULL)</text>
    <path d="M250 180 H318" stroke="#fbbf24" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M318 180 L304 170 M318 180 L304 190" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <rect x="335" y="130" width="170" height="100" rx="14" fill="#071a1a" stroke="#a78bfa" stroke-width="5"/>
    <text x="420" y="172" font-size="22" text-anchor="middle" fill="#a78bfa">srand</text>
    <text x="420" y="204" font-size="15" text-anchor="middle" opacity=".7">the seed</text>
    <path d="M505 180 H552" stroke="#a78bfa" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M562 180 L548 170 M562 180 L548 190" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    <g font-size="28" fill="#34d399">
      <rect x="570" y="95" width="290" height="170" rx="14" fill="#04100f" stroke="#34d399" stroke-width="4"/>
      <text x="715" y="150" text-anchor="middle">84  87  78</text>
      <text x="715" y="196" text-anchor="middle">16  94  ...</text>
    </g>
    <text x="715" y="305" font-size="17" text-anchor="middle" fill="#34d399">rand() sequence</text>
    <text x="40" y="52" font-size="17" opacity=".75" fill="#a78bfa">srand((unsigned) time(NULL));</text>
  </g>
</svg>
