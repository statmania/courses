<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Validating numeric input in C</title>
  <desc id="d">Typed input goes through a check. Input like 5 passes and is used. Input like abc or 12abc fails and an error message is printed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1410"/>
      <stop offset="1" stop-color="#14201a"/>
    </linearGradient>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#24382d"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#ecf5ef">
    <g fill="#0b1410" stroke-width="2">
      <rect x="40" y="105" width="200" height="90" rx="12" stroke="#fbbf24"/>
      <rect x="350" y="105" width="200" height="90" rx="12" stroke="#e8ecef"/>
      <rect x="660" y="40" width="200" height="80" rx="12" stroke="#34d399"/>
      <rect x="660" y="180" width="200" height="80" rx="12" stroke="#fb923c"/>
    </g>
    <text x="140" y="145" font-size="20" fill="#fbbf24">user types</text>
    <text x="140" y="174" font-size="16" fill="#a8b8ae">5   abc   12abc</text>
    <text x="450" y="145" font-size="20">check it</text>
    <text x="450" y="174" font-size="16" fill="#a8b8ae">is it all a number?</text>
    <text x="760" y="88" font-size="18" fill="#34d399">yes → use it</text>
    <text x="760" y="228" font-size="18" fill="#fb923c">no → error</text>
    <path d="M240 150 H345" stroke="#fbbf24" stroke-width="2" marker-end="url(#g)"/>
    <path d="M550 135 L655 82" stroke="#34d399" stroke-width="2" marker-end="url(#g)"/>
    <path d="M550 165 L655 218" stroke="#fb923c" stroke-width="2" marker-end="url(#o)"/>
  </g>
</svg>
