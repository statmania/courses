<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Nested if flowchart: membership discount</title>
  <desc id="d">First check whether the user is a member. If not, apply 0 percent discount. If yes, check whether the purchase is at least 1000 dollars: yes gives 20 percent, no gives 10 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="400" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="398" rx="17" fill="none" stroke="#1b2540"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <text x="450" y="32" fill="#6b7a99" font-size="12" letter-spacing="2">OUTER CHECK FIRST · INNER CHECK ONLY IF THE OUTER IS TRUE</text>

    <!-- connectors -->
    <g fill="none" stroke-width="2" marker-end="url(#arrow)">
      <path d="M240 150 H340" stroke="#00e5ff"/>
      <path d="M150 205 V340 H660" stroke="#ff2fb4"/>
      <path d="M450 95 V80 H660" stroke="#00e5ff"/>
      <path d="M450 205 V220 H660" stroke="#ff2fb4"/>
    </g>

    <!-- outer decision -->
    <polygon points="150,95 240,150 150,205 60,150" fill="#0a0f1e" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
    <text x="150" y="146" fill="#e6edf7" font-size="14">isMember</text>
    <text x="150" y="165" fill="#e6edf7" font-size="14">== 1 ?</text>
    <text x="290" y="138" fill="#00e5ff" font-size="14" font-weight="700">YES</text>
    <text x="185" y="290" fill="#ff2fb4" font-size="14" font-weight="700" text-anchor="start">NO</text>

    <!-- inner decision -->
    <polygon points="450,95 560,150 450,205 340,150" fill="#0a0f1e" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
    <text x="450" y="146" fill="#e6edf7" font-size="14">purchaseAmount</text>
    <text x="450" y="165" fill="#e6edf7" font-size="14">&gt;= 1000 ?</text>
    <text x="520" y="76" fill="#00e5ff" font-size="14" font-weight="700">YES</text>
    <text x="520" y="240" fill="#ff2fb4" font-size="14" font-weight="700">NO</text>
    <text x="360" y="108" fill="#6b7a99" font-size="11">nested inside the outer YES</text>

    <!-- results -->
    <rect x="660" y="55" width="200" height="50" rx="10" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="760" y="86" fill="#e6edf7" font-size="15">20% discount</text>
    <rect x="660" y="195" width="200" height="50" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="760" y="226" fill="#e6edf7" font-size="15">10% discount</text>
    <rect x="660" y="315" width="200" height="50" rx="10" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="760" y="346" fill="#e6edf7" font-size="15">0% discount</text>
  </g>
</svg>
