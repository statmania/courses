<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Tossing a die until we get a 6</title>
  <desc id="d">Several small faded dice showing other faces roll toward a large die showing 6, with scraps of C code such as rand() % 6 + 1 and dice == 6 around them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b18"/>
      <stop offset="1" stop-color="#2a1226"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#4a2243"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#fdf2e9">
    <g opacity="0.45" transform="rotate(-14 130 200)"><rect x="90.0" y="160.0" width="80" height="80" rx="14.399999999999999" fill="#1a0b18" stroke="#a3e635" stroke-width="5"/><circle cx="109.2" cy="179.2" r="6.4" fill="#a3e635"/><circle cx="130" cy="200" r="6.4" fill="#a3e635"/><circle cx="150.8" cy="220.8" r="6.4" fill="#a3e635"/></g><g opacity="0.55" transform="rotate(12 260 250)"><rect x="220.0" y="210.0" width="80" height="80" rx="14.399999999999999" fill="#1a0b18" stroke="#a3e635" stroke-width="5"/><circle cx="260" cy="250" r="6.4" fill="#a3e635"/></g><g opacity="0.7" transform="rotate(-8 380 170)"><rect x="335.0" y="125.0" width="90" height="90" rx="16.2" fill="#1a0b18" stroke="#a3e635" stroke-width="5"/><circle cx="356.6" cy="146.6" r="7.2" fill="#a3e635"/><circle cx="403.4" cy="146.6" r="7.2" fill="#a3e635"/><circle cx="356.6" cy="193.4" r="7.2" fill="#a3e635"/><circle cx="403.4" cy="193.4" r="7.2" fill="#a3e635"/></g><g opacity="1" transform="rotate(0 640 190)"><rect x="545.0" y="95.0" width="190" height="190" rx="34.199999999999996" fill="#2a1226" stroke="#fb7185" stroke-width="5"/><circle cx="590.6" cy="140.6" r="15.200000000000001" fill="#fb7185"/><circle cx="689.4" cy="140.6" r="15.200000000000001" fill="#fb7185"/><circle cx="590.6" cy="190" r="15.200000000000001" fill="#fb7185"/><circle cx="689.4" cy="190" r="15.200000000000001" fill="#fb7185"/><circle cx="590.6" cy="239.4" r="15.200000000000001" fill="#fb7185"/><circle cx="689.4" cy="239.4" r="15.200000000000001" fill="#fb7185"/></g>
    <path d="M440 200 C490 190 520 190 535 195" fill="none" stroke="#a3e635" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
    <g font-size="17">
      <text x="40" y="60" fill="#a3e635" opacity=".85">dice = rand() % 6 + 1;</text>
      <text x="520" y="62" fill="#fb7185" opacity=".9">if (dice == 6) break;</text>
      <text x="60" y="330" fill="#fdf2e9" opacity=".6">steps++;</text>
    </g>
    <text x="640" y="335" font-size="30" text-anchor="middle" fill="#fb7185">6! stop</text>
  </g>
</svg>
