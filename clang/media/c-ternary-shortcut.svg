<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">The ternary operator as a shortcut for if-else</title>
  <desc id="d">On the left, a five-line if-else block that assigns the larger of a and b to max. An arrow leads to the right, where the same logic is one line using the question mark and colon operator, with the condition, the true value and the false value labelled.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0f10"/><stop offset="1" stop-color="#3b1a14"/></linearGradient></defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#6b2e22"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#fff1e6">
    <rect x="36" y="50" width="340" height="250" rx="12" fill="#1c0808" stroke="#fb7185" stroke-width="3"/>
    <text x="56" y="86" font-size="14" fill="#fda4af">long form</text>
    <text x="56" y="130" font-size="20"><tspan fill="#fb7185">if</tspan> (a &gt; b) {</text>
    <text x="56" y="162" font-size="20"><tspan dx="24">max = a;</tspan></text>
    <text x="56" y="194" font-size="20">} <tspan fill="#fb7185">else</tspan> {</text>
    <text x="56" y="226" font-size="20"><tspan dx="24">max = b;</tspan></text>
    <text x="56" y="258" font-size="20">}</text>
    <path d="M395 175 H470" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <path d="M458 160 L478 175 L458 190" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="490" y="95" width="380" height="160" rx="12" fill="#1c0808" stroke="#fbbf24" stroke-width="3"/>
    <text x="510" y="130" font-size="14" fill="#fcd34d">shortcut</text>
    <text x="510" y="175" font-size="22">max = <tspan fill="#7dd3fc">a &gt; b</tspan> <tspan fill="#fbbf24" font-weight="bold">?</tspan> <tspan fill="#86efac">a</tspan> <tspan fill="#fbbf24" font-weight="bold">:</tspan> <tspan fill="#fda4af">b</tspan>;</text>
    <text x="510" y="212" font-size="14" fill="#7dd3fc">condition</text>
    <text x="610" y="212" font-size="14" fill="#86efac">if true</text>
    <text x="700" y="212" font-size="14" fill="#fda4af">if false</text>
    <text x="510" y="238" font-size="13" fill="#d6b8a8">5 lines become 1</text>
  </g>
</svg>
