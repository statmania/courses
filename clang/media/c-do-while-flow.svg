<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">do-while loop flowchart</title>
  <desc id="d">The loop body runs first. Then the condition is tested. If it is true, control returns to the body; if it is false, the loop ends. The body therefore always runs at least once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <text x="450" y="32" fill="#6b7a99" font-size="12" letter-spacing="2">BODY FIRST · TEST AFTER · RUNS AT LEAST ONCE</text>

    <g fill="none" stroke="#9fb3d1" stroke-width="2">
      <path d="M110 200 H160" marker-end="url(#arrow)"/>
      <path d="M380 200 H440" marker-end="url(#arrow)"/>
      <path d="M660 200 H730" stroke="#ff2fb4" marker-end="url(#arrow)"/>
      <path d="M550 140 V90 H270 V150" stroke="#00e5ff" marker-end="url(#arrow)"/>
    </g>

    <rect x="20" y="175" width="90" height="50" rx="25" fill="#0a0f1e" stroke="url(#accent)" stroke-width="2"/>
    <text x="65" y="206" fill="#e6edf7" font-size="15">start</text>

    <rect x="160" y="150" width="220" height="100" rx="12" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2.5"/>
    <text x="270" y="188" fill="#8be9ff" font-size="14">do {</text>
    <text x="270" y="212" fill="#e6edf7" font-size="14">scanf("%d", &amp;PIN);</text>
    <text x="270" y="234" fill="#8be9ff" font-size="14">}</text>

    <polygon points="550,140 660,200 550,260 440,200" fill="#0a0f1e" stroke="#a855f7" stroke-width="2.5"/>
    <text x="550" y="196" fill="#e6edf7" font-size="14">PIN !=</text>
    <text x="550" y="216" fill="#e6edf7" font-size="14">2471 ?</text>

    <text x="410" y="122" fill="#00e5ff" font-size="14" font-weight="700">true: repeat</text>
    <text x="700" y="190" fill="#ff2fb4" font-size="14" font-weight="700">false</text>

    <rect x="730" y="175" width="150" height="50" rx="25" fill="#0a0f1e" stroke="url(#accent)" stroke-width="2"/>
    <text x="805" y="206" fill="#e6edf7" font-size="15">exit loop</text>

    <text x="270" y="290" fill="#6b7a99" font-size="12">1  the body always runs first</text>
    <text x="550" y="290" fill="#6b7a99" font-size="12">2  then the condition is checked</text>
  </g>
</svg>
