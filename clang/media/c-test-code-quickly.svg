<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Testing C code quickly</title>
  <desc id="d">A sketch of a person at a computer. The monitor shows a terminal running gcc test.c and printing hi. A large hexagonal C logo sits beside it, with scraps of C code floating around.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#243459"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#eaf0ff">
    <!-- floating code scraps -->
    <g font-size="17" opacity="0.8">
      <text x="40" y="60" fill="#38bdf8">#include &lt;stdio.h&gt;</text>
      <text x="60" y="318" fill="#facc15">int main(void)</text>
      <text x="640" y="48" fill="#fb7185">printf("hi\n");</text>
      <text x="690" y="330" fill="#38bdf8">return 0;</text>
      <text x="560" y="300" fill="#facc15">&amp;&amp;</text>
      <text x="30" y="190" fill="#fb7185">{ }</text>
    </g>
    <!-- C logo -->
    <g transform="translate(150 175)">
      <polygon points="0,-95 82,-47 82,47 0,95 -82,47 -82,-47" fill="#0a1020" stroke="#38bdf8" stroke-width="5"/>
      <path d="M38,-32 A46,46 0 1 0 38,32" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
    </g>
    <!-- monitor -->
    <rect x="330" y="80" width="300" height="190" rx="12" fill="#0a1020" stroke="#facc15" stroke-width="4"/>
    <rect x="344" y="94" width="272" height="162" rx="6" fill="#050813"/>
    <g font-size="15">
      <text x="356" y="122" fill="#9fb0d6">$ gcc test.c -o test &amp;&amp; ./test</text>
      <text x="356" y="150" fill="#34d399">hi</text>
      <text x="356" y="178" fill="#9fb0d6">$ <tspan fill="#facc15">▌</tspan></text>
    </g>
    <path d="M470 270 V300 M420 300 H520" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <!-- user -->
    <g transform="translate(760 215)" stroke="#fb7185" stroke-width="5" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-14" r="26" fill="#0a1020"/>
      <path d="M-48,70 C-48,25 -30,28 0,28 C30,28 48,25 48,70 Z"/>
    </g>
    <path d="M715 235 L640 215" stroke="#fb7185" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  </g>
</svg>
