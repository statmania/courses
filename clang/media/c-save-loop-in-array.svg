<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Saving loop results in an array</title>
  <desc id="d">A for loop with index i from 0 to 4 writes i*i into results[i], filling an array of five boxes with 0, 1, 4, 9 and 16.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff2fb4"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <rect x="200" y="25" width="500" height="55" rx="10" fill="#0a0f1e" stroke="#a855f7" stroke-width="2"/>
    <text x="450" y="59" font-size="18">for (i = 0; i &lt; SIZE; i++) results[i] = i * i;</text>
    <g fill="none" stroke="#ff2fb4" stroke-width="2">
      <path d="M450 80 C450 120 120 100 120 150" marker-end="url(#arrow)" opacity=".35"/>
      <path d="M450 80 C450 120 285 100 285 150" marker-end="url(#arrow)" opacity=".5"/>
      <path d="M450 80 V150" marker-end="url(#arrow)" opacity=".7"/>
      <path d="M450 80 C450 120 615 100 615 150" marker-end="url(#arrow)" opacity=".85"/>
      <path d="M450 80 C450 120 780 100 780 150" marker-end="url(#arrow)"/>
    </g>
    <g stroke="#00e5ff" stroke-width="2" fill="#0a0f1e">
      <rect x="60" y="155" width="120" height="70" rx="8"/>
      <rect x="225" y="155" width="120" height="70" rx="8"/>
      <rect x="390" y="155" width="120" height="70" rx="8"/>
      <rect x="555" y="155" width="120" height="70" rx="8"/>
      <rect x="720" y="155" width="120" height="70" rx="8"/>
    </g>
    <g font-size="28" fill="#00e5ff">
      <text x="120" y="200">0</text><text x="285" y="200">1</text><text x="450" y="200">4</text>
      <text x="615" y="200">9</text><text x="780" y="200">16</text>
    </g>
    <g font-size="15" fill="#9aa4c2">
      <text x="120" y="252">results[0]</text><text x="285" y="252">results[1]</text>
      <text x="450" y="252">results[2]</text><text x="615" y="252">results[3]</text>
      <text x="780" y="252">results[4]</text>
    </g>
  </g>
</svg>
