<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">One int, three variables</title>
  <desc id="d">A code editor on a navy background shows the line int a, b, c; Below it, three labelled boxes a, b and c all share one int tag. A second line, int *p, q; shows p as a pointer box and q as a plain int box.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08122b"/><stop offset="1" stop-color="#0f1d3f"/></linearGradient></defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#24407a"/>
  <rect x="40" y="30" width="400" height="240" rx="12" fill="#070d1f" stroke="#3b82f6" stroke-width="2"/>
  <path d="M40,42 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v20 h-400 z" fill="#14264f"/>
  <circle cx="62" cy="46" r="6" fill="#f87171"/><circle cx="84" cy="46" r="6" fill="#facc15"/><circle cx="106" cy="46" r="6" fill="#4ade80"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="20" font-weight="700">
    <text x="64" y="110" fill="#93c5fd">int <tspan fill="#fde68a">a, b, c</tspan><tspan fill="#93c5fd">;</tspan></text>
    <text x="64" y="160" fill="#93c5fd">int <tspan fill="#fde68a">x = 5, y = 10</tspan><tspan fill="#93c5fd">;</tspan></text>
    <text x="64" y="210" fill="#93c5fd">int <tspan fill="#fde68a">*p, q</tspan><tspan fill="#93c5fd">;</tspan></text>
    <text x="64" y="248" fill="#5b7bb8" font-size="14" font-weight="400">// only p is a pointer!</text>
  </g>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" font-weight="700">
    <rect x="490" y="40" width="80" height="34" rx="17" fill="#3b82f6"/><text x="530" y="63" font-size="18" fill="#08122b">int</text>
    <path d="M530,74 V92 M530,92 H620 M530,92 H710 M530,92 H800 M620,92 V104 M710,92 V104 M800,92 V104" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
    <g font-size="28" fill="#fef9c3">
      <rect x="580" y="104" width="80" height="70" rx="12" fill="#1c1a08" stroke="#facc15" stroke-width="2.5"/><text x="620" y="150">a</text>
      <rect x="670" y="104" width="80" height="70" rx="12" fill="#1c1a08" stroke="#facc15" stroke-width="2.5"/><text x="710" y="150">b</text>
      <rect x="760" y="104" width="80" height="70" rx="12" fill="#1c1a08" stroke="#facc15" stroke-width="2.5"/><text x="800" y="150">c</text>
    </g>
    <text x="710" y="200" font-size="15" fill="#93c5fd" font-weight="400">one type, three variables</text>
    <rect x="490" y="226" width="150" height="40" rx="10" fill="#0b1a3a" stroke="#3b82f6" stroke-width="2.5"/><text x="565" y="252" font-size="17" fill="#bfdbfe">p : int *</text>
    <rect x="680" y="226" width="150" height="40" rx="10" fill="#1c1a08" stroke="#facc15" stroke-width="2.5"/><text x="755" y="252" font-size="17" fill="#fef9c3">q : int</text>
  </g>
</svg>
