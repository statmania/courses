<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">A for loop with its three parts</title>
  <desc id="d">The header of a for loop, for (int i = 1; i &lt;= 5; i++), with its init, condition and update parts labelled, beside a terminal printing a triangle of asterisks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07170f"/>
      <stop offset="1" stop-color="#0d2a1b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1f4a33"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e8fff1">
    <text x="40" y="120" font-size="28"><tspan fill="#a3e635">for</tspan> (<tspan fill="#34d399">int i = 1</tspan>; <tspan fill="#facc15">i &lt;= 5</tspan>; <tspan fill="#f472b6">i++</tspan>)</text>
    <g font-size="16">
      <path d="M170 135 V170" stroke="#34d399" stroke-width="3"/><text x="170" y="195" text-anchor="middle" fill="#34d399">init</text>
      <path d="M262 135 V230" stroke="#facc15" stroke-width="3"/><text x="262" y="255" text-anchor="middle" fill="#facc15">condition</text>
      <path d="M365 135 V170" stroke="#f472b6" stroke-width="3"/><text x="365" y="195" text-anchor="middle" fill="#f472b6">update</text>
    </g>
    <text x="40" y="335" font-size="16" opacity=".7">all three parts live in one line</text>
    <rect x="520" y="50" width="340" height="260" rx="12" fill="#04100a" stroke="#a3e635" stroke-width="4"/>
    <circle cx="548" cy="76" r="6" fill="#f472b6"/><circle cx="570" cy="76" r="6" fill="#facc15"/><circle cx="592" cy="76" r="6" fill="#34d399"/>
    <g font-size="26" fill="#a3e635">
      <text x="548" y="132">*</text><text x="548" y="164">**</text><text x="548" y="196">***</text>
      <text x="548" y="228">****</text><text x="548" y="260">*****</text>
    </g>
  </g>
</svg>
