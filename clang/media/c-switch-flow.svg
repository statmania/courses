<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">How a switch statement works</title>
  <desc id="d">The switch expression is compared with each case label. The matching case runs its statements, then break jumps to the code after the switch. If nothing matches, default runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/></marker>
  </defs>
  <rect width="900" height="400" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="398" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <text x="450" y="32" fill="#6b7a99" font-size="12" letter-spacing="2">MATCH A CASE · RUN IT · break JUMPS OUT</text>
    <g fill="none" stroke="#9fb3d1" stroke-width="2" marker-end="url(#arrow)">
      <path d="M210 197 H255 V85 H300" stroke="#00e5ff"/>
      <path d="M580 85 H650" />
      <path d="M730 85 H850" marker-end="none"/>
      <path d="M210 197 H255 V160 H300" stroke="#00e5ff"/>
      <path d="M580 160 H650" />
      <path d="M730 160 H850" marker-end="none"/>
      <path d="M210 197 H255 V235 H300" stroke="#00e5ff"/>
      <path d="M580 235 H650" />
      <path d="M730 235 H850" marker-end="none"/>
      <path d="M210 197 H255 V310 H300" stroke="#ff2fb4"/>
      <path d="M580 310 H650" />
      <path d="M730 310 H850" marker-end="none"/>
      <path d="M850 85 V346" />
    </g>
    <rect x="40" y="160" width="170" height="74" rx="12" fill="#0a0f1e" stroke="#a855f7" stroke-width="2.5"/>
    <text x="125" y="192" fill="#c084fc" font-size="15">switch</text>
    <text x="125" y="214" fill="#e6edf7" font-size="15">(choice)</text>
    <rect x="300" y="63" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="360" y="90" fill="#e6edf7" font-size="15">case 1:</text>
    <path d="M420 85 H460" stroke="#9fb3d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="460" y="63" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#1b2540" stroke-width="1.5"/>
    <text x="520" y="90" fill="#9fb3d1" font-size="11.5">printf("Balance");</text>
    <rect x="650" y="69" width="80" height="32" rx="16" fill="#0a0f1e" stroke="#fbbf24" stroke-width="2"/>
    <text x="690" y="90" fill="#fbbf24" font-size="14">break;</text>
    <rect x="300" y="138" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="360" y="165" fill="#e6edf7" font-size="15">case 2:</text>
    <path d="M420 160 H460" stroke="#9fb3d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="460" y="138" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#1b2540" stroke-width="1.5"/>
    <text x="520" y="165" fill="#9fb3d1" font-size="11.5">printf("Deposit");</text>
    <rect x="650" y="144" width="80" height="32" rx="16" fill="#0a0f1e" stroke="#fbbf24" stroke-width="2"/>
    <text x="690" y="165" fill="#fbbf24" font-size="14">break;</text>
    <rect x="300" y="213" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#00e5ff" stroke-width="2"/>
    <text x="360" y="240" fill="#e6edf7" font-size="15">case 3:</text>
    <path d="M420 235 H460" stroke="#9fb3d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="460" y="213" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#1b2540" stroke-width="1.5"/>
    <text x="520" y="240" fill="#9fb3d1" font-size="11.5">printf("Withdraw");</text>
    <rect x="650" y="219" width="80" height="32" rx="16" fill="#0a0f1e" stroke="#fbbf24" stroke-width="2"/>
    <text x="690" y="240" fill="#fbbf24" font-size="14">break;</text>
    <rect x="300" y="288" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#ff2fb4" stroke-width="2"/>
    <text x="360" y="315" fill="#e6edf7" font-size="15">default:</text>
    <path d="M420 310 H460" stroke="#9fb3d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="460" y="288" width="120" height="44" rx="8" fill="#0a0f1e" stroke="#1b2540" stroke-width="1.5"/>
    <text x="520" y="315" fill="#9fb3d1" font-size="11.5">printf("Invalid");</text>
    <rect x="650" y="294" width="80" height="32" rx="16" fill="#0a0f1e" stroke="#fbbf24" stroke-width="2"/>
    <text x="690" y="315" fill="#fbbf24" font-size="14">break;</text>
    <text x="300" y="352" fill="#6b7a99" font-size="12" text-anchor="start">no case matches → default runs</text>
    <rect x="700" y="346" width="190" height="36" rx="18" fill="#0a0f1e" stroke="url(#bg)"/>
    <rect x="700" y="346" width="190" height="36" rx="18" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <text x="795" y="369" fill="#e6edf7" font-size="14">after the switch</text>
  </g>
</svg>