<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">A while loop with two exits</title>
  <desc id="d">A loop box with the condition i &lt; 10. A teal arrow on the right is the normal exit when the condition becomes false. A red arrow at the bottom is the break exit, taken at once when i equals 4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07161a"/>
      <stop offset="1" stop-color="#0d2326"/>
    </linearGradient>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#1d4146"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <!-- loop box -->
    <rect x="70" y="70" width="400" height="190" rx="14" fill="#0a1d21" stroke="#2dd4bf" stroke-width="2"/>
    <text x="90" y="100" font-size="14" fill="#7fb8b2">while loop</text>
    <text x="100" y="140" font-size="20" fill="#e6f4f1">while (i &lt; 10) {</text>
    <text x="130" y="175" font-size="20" fill="#ff6b6b">if (i == 4) break;</text>
    <text x="130" y="205" font-size="20" fill="#e6f4f1">printf(i); i++;</text>
    <text x="100" y="235" font-size="20" fill="#e6f4f1">}</text>
    <!-- normal exit -->
    <path d="M470 150 H640" stroke="#2dd4bf" stroke-width="3" fill="none" marker-end="url(#ag)"/>
    <text x="490" y="135" font-size="15" fill="#2dd4bf">i &lt; 10 is false</text>
    <rect x="650" y="115" width="180" height="70" rx="10" fill="#0a1d21" stroke="#2dd4bf"/>
    <text x="740" y="145" font-size="17" fill="#2dd4bf" text-anchor="middle">normal exit</text>
    <text x="740" y="168" font-size="13" fill="#7fb8b2" text-anchor="middle">the planned bound</text>
    <!-- break exit -->
    <path d="M300 260 V300 H640" stroke="#ff6b6b" stroke-width="3" fill="none" marker-end="url(#ar)"/>
    <text x="320" y="292" font-size="15" fill="#ff6b6b">i == 4: break</text>
    <rect x="650" y="265" width="180" height="70" rx="10" fill="#0a1d21" stroke="#ff6b6b"/>
    <text x="740" y="295" font-size="17" fill="#ff6b6b" text-anchor="middle">break exit</text>
    <text x="740" y="318" font-size="13" fill="#7fb8b2" text-anchor="middle">a special case found</text>
    <text x="70" y="45" font-size="17" fill="#e6f4f1">Two ways out of one loop</text>
  </g>
</svg>
