<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">struct Student memory layout</title>
  <desc id="d">A struct Student is one block of 60 bytes: name takes bytes 0 to 49, 2 bytes of padding follow, id takes bytes 52 to 55 and gpa takes bytes 56 to 59.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="378" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle">
    <text x="450" y="34" fill="#6b7a99" font-size="12" letter-spacing="2">ONE VARIABLE · ONE BLOCK OF MEMORY · WIDTH IS TO SCALE</text>

    <!-- declaration -->
    <rect x="220" y="56" width="460" height="86" rx="12" fill="#0a0f1e" stroke="#1b2540" stroke-width="1.5"/>
    <g font-size="15" fill="#e6edf7" text-anchor="start" xml:space="preserve">
      <text x="246" y="84"><tspan fill="#c084fc">struct</tspan> Student {</text>
      <text x="246" y="105" fill="#8be9ff">    char  name[50];</text>
      <text x="246" y="126" fill="#ff9bd8">    int   id;   float gpa;</text>
    </g>
    <text x="662" y="126" fill="#e6edf7" font-size="15" text-anchor="end">};</text>

    <!-- arrow -->
    <path d="M450 146 V176" stroke="#9fb3d1" stroke-width="2" fill="none"/>
    <path d="M443 170 L450 180 L457 170" stroke="#9fb3d1" stroke-width="2" fill="none"/>

    <!-- memory bar: 60 bytes over 800px (13.33 px/byte) -->
    <rect x="50"  y="196" width="666.7" height="64" fill="#00e5ff" fill-opacity=".18" stroke="#00e5ff" stroke-width="2"/>
    <rect x="716.7" y="196" width="26.7" height="64" fill="#6b7a99" fill-opacity=".25" stroke="#6b7a99" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="743.3" y="196" width="53.3" height="64" fill="#a855f7" fill-opacity=".25" stroke="#a855f7" stroke-width="2"/>
    <rect x="796.7" y="196" width="53.3" height="64" fill="#ff2fb4" fill-opacity=".22" stroke="#ff2fb4" stroke-width="2"/>

    <text x="383" y="234" fill="#e6edf7" font-size="17">name  ·  50 bytes</text>
    <text x="770" y="234" fill="#e6edf7" font-size="15">id</text>
    <text x="823" y="234" fill="#e6edf7" font-size="15">gpa</text>

    <!-- offsets -->
    <g font-size="12" fill="#9fb3d1">
      <text x="50" y="282">0</text>
      <text x="716.7" y="282">50</text>
      <text x="743.3" y="282">52</text>
      <text x="796.7" y="282">56</text>
      <text x="850" y="282">60</text>
    </g>
    <g font-size="12">
      <text x="770" y="302" fill="#d8b4fe">4 bytes</text>
      <text x="823" y="302" fill="#ff9bd8">4 bytes</text>
      <text x="730" y="322" fill="#9fb3d1">padding</text>
      <text x="730" y="338" fill="#9fb3d1">2 bytes</text>
    </g>
    <text x="330" y="322" fill="#9fb3d1" font-size="13">sizeof(struct Student) = 60, not 58</text>
    <text x="330" y="342" fill="#6b7a99" font-size="12">the compiler aligns int and float to 4-byte boundaries</text>
  </g>
</svg>
