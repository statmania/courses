<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Nested for loops and a grid</title>
  <desc id="d">An outer for loop over rows containing an inner for loop over columns, drawn beside a grid of dots with one dot highlighted at row 2, column 4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08122a"/><stop offset="1" stop-color="#0f1e45"/></linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#25396b"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#eaf2ff">
    <text x="40" y="100" font-size="22"><tspan fill="#fbbf24">for</tspan> (row ...) {</text>
    <text x="80" y="150" font-size="22"><tspan fill="#38bdf8">for</tspan> (col ...) {</text>
    <text x="120" y="200" font-size="22">printf("* ");</text>
    <text x="80" y="250" font-size="22" fill="#38bdf8">}</text>
    <text x="80" y="280" font-size="16" opacity=".8">printf("\n");</text>
    <text x="40" y="320" font-size="22" fill="#fbbf24">}</text>
    <circle cx="560" cy="90" r="14" fill="#38bdf8" opacity=".75"/><circle cx="612" cy="90" r="14" fill="#38bdf8" opacity=".75"/><circle cx="664" cy="90" r="14" fill="#38bdf8" opacity=".75"/><circle cx="716" cy="90" r="14" fill="#38bdf8" opacity=".75"/><circle cx="768" cy="90" r="14" fill="#38bdf8" opacity=".75"/><circle cx="820" cy="90" r="14" fill="#38bdf8" opacity=".75"/><circle cx="560" cy="142" r="14" fill="#38bdf8" opacity=".75"/><circle cx="612" cy="142" r="14" fill="#38bdf8" opacity=".75"/><circle cx="664" cy="142" r="14" fill="#38bdf8" opacity=".75"/><circle cx="716" cy="142" r="14" fill="#fbbf24" opacity="1"/><circle cx="768" cy="142" r="14" fill="#38bdf8" opacity=".75"/><circle cx="820" cy="142" r="14" fill="#38bdf8" opacity=".75"/><circle cx="560" cy="194" r="14" fill="#38bdf8" opacity=".75"/><circle cx="612" cy="194" r="14" fill="#38bdf8" opacity=".75"/><circle cx="664" cy="194" r="14" fill="#38bdf8" opacity=".75"/><circle cx="716" cy="194" r="14" fill="#38bdf8" opacity=".75"/><circle cx="768" cy="194" r="14" fill="#38bdf8" opacity=".75"/><circle cx="820" cy="194" r="14" fill="#38bdf8" opacity=".75"/><circle cx="560" cy="246" r="14" fill="#38bdf8" opacity=".75"/><circle cx="612" cy="246" r="14" fill="#38bdf8" opacity=".75"/><circle cx="664" cy="246" r="14" fill="#38bdf8" opacity=".75"/><circle cx="716" cy="246" r="14" fill="#38bdf8" opacity=".75"/><circle cx="768" cy="246" r="14" fill="#38bdf8" opacity=".75"/><circle cx="820" cy="246" r="14" fill="#38bdf8" opacity=".75"/>
    <text x="690" y="325" font-size="16" text-anchor="middle" opacity=".7">outer = rows, inner = columns</text>
  </g>
</svg>