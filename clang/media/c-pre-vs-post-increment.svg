<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Pre-increment versus post-increment in C</title>
  <desc id="d">With a = 5, b = ++a increments first so a and b both become 6. With x = 5, y = x++ assigns the old value first so y is 5 and x becomes 6.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff2fb4"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2540"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" text-anchor="middle" fill="#e8ecf7">
    <text x="225" y="50" font-size="22" fill="#00e5ff">pre: b = ++a;</text>
    <text x="675" y="50" font-size="22" fill="#a855f7">post: y = x++;</text>
    <g fill="#0a0f1e" stroke-width="2">
      <rect x="125" y="95" width="200" height="60" rx="10" stroke="#00e5ff"/>
      <rect x="575" y="95" width="200" height="60" rx="10" stroke="#a855f7"/>
    </g>
    <text x="225" y="132" font-size="18">1. a: 5 → 6</text>
    <text x="675" y="132" font-size="18">1. y = 5 (old x)</text>
    <path d="M225 155 V195" stroke="#ff2fb4" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M675 155 V195" stroke="#ff2fb4" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#0a0f1e" stroke-width="2">
      <rect x="125" y="200" width="200" height="60" rx="10" stroke="#00e5ff"/>
      <rect x="575" y="200" width="200" height="60" rx="10" stroke="#a855f7"/>
    </g>
    <text x="225" y="237" font-size="18">2. b = 6 → a=6, b=6</text>
    <text x="675" y="237" font-size="18">2. x: 5 → 6 → x=6, y=5</text>
    <text x="450" y="135" font-size="28" fill="#9aa4c2">vs</text>
  </g>
</svg>
