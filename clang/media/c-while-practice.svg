<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">A while loop printing numbers</title>
  <desc id="d">A terminal window printing 1 to 5 inside a circular arrow that represents a while loop repeating, with the code while (i &lt;= 10) and i++ beside it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f08"/>
      <stop offset="1" stop-color="#2a1a0e"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="#4a3220"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#fff4e8">
    <circle cx="190" cy="185" r="115" fill="none" stroke="#fb923c" stroke-width="10" stroke-dasharray="560 170" stroke-linecap="round" transform="rotate(-70 190 185)"/>
    <polygon points="95.8,117.7 97.7,134.9 80.3,125.1" fill="#fb923c"/>
    <text x="190" y="178" font-size="30" text-anchor="middle" fill="#2dd4bf">while</text>
    <text x="190" y="214" font-size="22" text-anchor="middle">(i &lt;= 10)</text>
    <rect x="420" y="70" width="440" height="220" rx="12" fill="#120a05" stroke="#2dd4bf" stroke-width="4"/>
    <circle cx="448" cy="94" r="6" fill="#fb923c"/><circle cx="470" cy="94" r="6" fill="#facc15"/><circle cx="492" cy="94" r="6" fill="#2dd4bf"/>
    <g font-size="20" fill="#fff4e8">
      <text x="448" y="140">1</text><text x="448" y="170">2</text><text x="448" y="200">3</text><text x="448" y="230">4</text>
      <text x="448" y="260" fill="#fb923c">5 ...</text>
    </g>
    <g font-size="17" opacity=".85">
      <text x="650" y="150" fill="#2dd4bf">printf("%d\n", i);</text>
      <text x="650" y="200" fill="#fb923c">i++;</text>
    </g>
    <text x="190" y="335" font-size="16" text-anchor="middle" opacity=".7">repeat while the test is true</text>
  </g>
</svg>
